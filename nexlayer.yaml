application:
  name: "cat-chat"
  pods:
    # Frontend - React app with Nginx reverse proxy
    - name: "frontend"
      image: "registry.nexlayer.io/nexlayer-mcp/e5bb2f10-c504-4b24-a4a8-c5a7a46f1197/cat-chat-app-ed22c3be-frontend:fb8eb906-1762799452"
      path: "/"
      servicePorts: [80]

    # Backend - Node.js + Express + Socket.io server
    - name: "backend"
      image: "registry.nexlayer.io/nexlayer-mcp/e5bb2f10-c504-4b24-a4a8-c5a7a46f1197/cat-chat-app-ed22c3be-backend:fb8eb906-1762799452"
      servicePorts: [3001]
      vars:
        PORT: "3001"
        DB_HOST: "database.pod"
        DB_PORT: "5432"
        DB_NAME: "catchat"
        DB_USER: "postgres"
        DB_PASSWORD: "postgres"
        CLIENT_URL: "<% URL %>"

    # Database - PostgreSQL 15
    - name: "database"
      image: "registry.nexlayer.io/nexlayer-mcp/e5bb2f10-c504-4b24-a4a8-c5a7a46f1197/cat-chat-app-ed22c3be-database:fb8eb906-1762799452"
      servicePorts: [5432]
      vars:
        POSTGRES_DB: "catchat"
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "postgres"
        PGDATA: "/var/lib/postgresql/data"
      volumes:
        - name: "postgres-data"
          size: "2Gi"
          mountPath: "/var/lib/postgresql"