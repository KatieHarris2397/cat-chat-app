application:
  name: "cat-chat"
  pods:
    # Frontend - React app with Nginx reverse proxy
    - name: "frontend"
      image: "registry.nexlayer.io/nexlayer-mcp/62b8555a9bcb1433a857183de559749a/cat-chat-app-10a11bd5-frontend:cdcac9fb-1760646845"
      path: "/"
      servicePorts: [80]

    # Backend - Node.js + Express + Socket.io server
    - name: "backend"
      image: "registry.nexlayer.io/nexlayer-mcp/62b8555a9bcb1433a857183de559749a/cat-chat-app-10a11bd5-backend:cdcac9fb-1760646845"
      servicePorts: [3001]
      vars:
        PORT: "3001"
        DB_HOST: "database.pod"
        DB_PORT: "5432"
        DB_NAME: "catchat"
        DB_USER: "postgres"
        DB_PASSWORD: "postgres"
        CLIENT_URL: "<% URL %>"

    # Database - PostgreSQL 15
    - name: "database"
      image: "registry.nexlayer.io/nexlayer-mcp/62b8555a9bcb1433a857183de559749a/cat-chat-app-10a11bd5-database:cdcac9fb-1760646845"
      servicePorts: [5432]
      vars:
        POSTGRES_DB: "catchat"
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "postgres"
        PGDATA: "/var/lib/postgresql/data"
      volumes:
        - name: "postgres-data"
          size: "2Gi"
          mountPath: "/var/lib/postgresql"